# Render Blueprint — static site hosting for the patient web app.
#
# The app calls the API directly at https://api.homecarenursing.cloud/api
# (see src/config/env.js). VITE_API_BASE_URL is set explicitly so the
# built bundle always points at the backend server.
services:
  - type: web
    name: patient-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # SPA fallback — serve index.html for any path
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api.homecarenursing.cloud/api
